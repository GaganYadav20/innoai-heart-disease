# ============================================
# CardioVision AI - Docker Compose
# Enterprise Cardiac Risk Prediction Platform
# ============================================

services:
  # ─────────────────────────────────────────
  # PostgreSQL 16 Database
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cardiovision-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cardiovision}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Root}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cardiovision}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cardiovision-network

  # ─────────────────────────────────────────
  # Spring Boot Backend API
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cardiovision-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cardiovision}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-Root}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8000}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM:-noreply@cardiovision.ai}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - upload_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - cardiovision-network

  # ─────────────────────────────────────────
  # FastAPI AI Inference Service
  # ─────────────────────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: cardiovision-ai
    restart: unless-stopped
    environment:
      MODEL_DIR: /app/ml_models
      LOG_LEVEL: info
      WORKERS: 2
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    volumes:
      - model_data:/app/ml_models
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/ai/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    networks:
      - cardiovision-network

  # ─────────────────────────────────────────
  # React Frontend (built & served by Nginx)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_AI_URL: ${VITE_AI_URL:-/ai}
    container_name: cardiovision-frontend
    restart: unless-stopped
    networks:
      - cardiovision-network

  # ─────────────────────────────────────────
  # Nginx Reverse Proxy
  # ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: cardiovision-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
      - ai-service
    networks:
      - cardiovision-network

# ─────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  upload_data:
    driver: local
  model_data:
    driver: local

# ─────────────────────────────────────────
# Networks
# ─────────────────────────────────────────
networks:
  cardiovision-network:
    driver: bridge
    name: cardiovision-network
